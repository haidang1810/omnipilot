[package]
name = "omnipilot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
eframe = "0.33"
egui = "0.33"
egui-phosphor = "0.11"
image = "0.25.10"
imageproc = "0.27.0"
rfd = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-normalization = "0.1.26"
ureq = { version = "3.5.1", features = ["json"] }
uuid = { version = "1.29.0", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }
zip = "9.3.0"
